<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }
    .game-wrap { width: 100%; max-width: 680px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
    .game-title { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    .score-badge {
      background: #e6f1fb; color: #185fa5;
      border-radius: 8px; padding: 6px 14px;
      font-size: 13px; font-weight: 600; margin-left: auto;
    }
    .step-indicator { display: flex; gap: 5px; }
    .step-dot { width: 9px; height: 9px; border-radius: 50%; background: #d3d1c7; }
    .step-dot.done { background: #185fa5; }
    .step-dot.active { background: #ef9f27; }
    .case-card {
      background: #fff; border: 1px solid #e0dfd8;
      border-radius: 12px; padding: 1.25rem;
      margin-bottom: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .case-title { font-size: 12px; color: #888780; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .patient-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
    .info-item { background: #f5f5f0; border-radius: 8px; padding: 8px 12px; }
    .info-label { font-size: 11px; color: #888780; margin-bottom: 2px; }
    .info-value { font-size: 14px; color: #1a1a1a; font-weight: 600; }
    .symptoms { background: #faeeda; border-radius: 8px; padding: 12px; margin-bottom: 1rem; }
    .symptoms-label { font-size: 12px; color: #854f0b; margin-bottom: 8px; font-weight: 600; }
    .symptom-list { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
    .symptom-tag { background: #ef9f27; color: #412402; border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
    .question-label { font-size: 15px; color: #1a1a1a; font-weight: 600; margin-bottom: 12px; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
    .choice-btn {
      background: #fff; border: 1px solid #d3d1c7; border-radius: 8px;
      padding: 10px 14px; font-size: 14px; font-family: 'Sarabun', sans-serif;
      color: #1a1a1a; cursor: pointer; text-align: left;
      transition: background 0.15s, border-color 0.15s; line-height: 1.4;
    }
    .choice-btn:hover:not(:disabled) { background: #f5f5f0; border-color: #888780; }
    .choice-btn.correct { background: #eaf3de; border-color: #639922; color: #27500a; font-weight: 600; }
    .choice-btn.wrong { background: #fcebeb; border-color: #e24b4a; color: #791f1f; }
    .choice-btn:disabled { cursor: default; }
    .feedback-box { border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.7; margin-bottom: 1rem; display: none; }
    .feedback-box.success { background: #eaf3de; color: #27500a; border: 1px solid #97c459; display: block; }
    .feedback-box.error { background: #fcebeb; color: #791f1f; border: 1px solid #f09595; display: block; }
    .action-row { display: flex; gap: 8px; align-items: center; }
    .next-btn {
      margin-left: auto; background: #185fa5; border: none; border-radius: 8px;
      padding: 9px 20px; font-size: 14px; font-family: 'Sarabun', sans-serif;
      color: #fff; cursor: pointer; font-weight: 600; transition: background 0.15s;
    }
    .next-btn:hover { background: #0c447c; }
    .result-card {
      background: #fff; border: 1px solid #e0dfd8; border-radius: 12px;
      padding: 2.5rem; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .result-trophy { font-size: 52px; margin-bottom: 8px; }
    .result-label { font-size: 14px; color: #888780; }
    .result-score { font-size: 48px; font-weight: 700; color: #1a1a1a; margin: 6px 0; }
    .result-grade { font-size: 17px; font-weight: 600; margin: 6px 0 1.5rem; }
    .result-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-primary {
      background: #185fa5; border: none; border-radius: 8px; padding: 10px 22px;
      font-size: 14px; font-family: 'Sarabun', sans-serif; color: #fff;
      cursor: pointer; font-weight: 600; transition: background 0.15s;
    }
    .btn-primary:hover { background: #0c447c; }
  </style>
</head>

  }

const TOTAL = 5;
let round = 0, score = 0, answered = false, usedIndexes = [];

function shuffle(arr) {
  let a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuestion() {
  const avail = QUESTIONS.map((_, i) => i).filter(i => !usedIndexes.includes(i));
  const idx = avail[Math.floor(Math.random() * avail.length)];
  usedIndexes.push(idx);
  return QUESTIONS[idx];
}

function updateDots() {
  const el = document.getElementById("stepDots");
  el.innerHTML = "";
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement("div");
    d.className = "step-dot" + (i < round ? " done" : i === round ? " active" : "");
    el.appendChild(d);
  }
}

function renderCase(c) {
  answered = false;
  const shuffled = shuffle(c.choices);
  document.getElementById("gameArea").innerHTML = `
    <div class="case-card">
      <div class="case-title">📋 ประวัติคนไข้ — เคสที่ ${round + 1} จาก ${TOTAL}</div>
      <div class="patient-info">
        <div class="info-item"><div class="info-label">อายุ</div><div class="info-value">${c.patient.age}</div></div>
        <div class="info-item"><div class="info-label">เพศ</div><div class="info-value">${c.patient.sex}</div></div>
      </div>
      <div class="symptoms">
        <div class="symptoms-label">⚠️ อาการที่พบ</div>
        <ul class="symptom-list">${c.symptoms.map(s => `<li class="symptom-tag">${s}</li>`).join("")}</ul>
      </div>
      <div class="question-label">${c.question}</div>
      <div class="choices">
        ${shuffled.map(ch => `<button class="choice-btn" onclick="checkAnswer(this)">${ch}</button>`).join("")}
      </div>
      <div class="feedback-box" id="feedback"></div>
      <div class="action-row" id="actionRow" style="display:none;">
        <button class="next-btn" onclick="nextRound()">${round + 1 < TOTAL ? "เคสถัดไป →" : "ดูผลคะแนน →"}</button>
      </div>
    </div>`;
  document.getElementById("gameArea")._case = c;
}

function checkAnswer(btn) {
  if (answered) return;
  answered = true;
  const c = document.getElementById("gameArea")._case;
  const chosen = btn.textContent.trim();
  document.querySelectorAll(".choice-btn").forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === c.answer) b.className = "choice-btn correct";
  });
  const fb = document.getElementById("feedback");
  if (chosen === c.answer) {
    score++;
    document.getElementById("scoreBadge").textContent = "คะแนน: " + score;
    btn.className = "choice-btn correct";
    fb.className = "feedback-box success";
    fb.innerHTML = "<strong>✅ ถูกต้อง!</strong> " + c.explanation;
  } else {
    btn.className = "choice-btn wrong";
    fb.className = "feedback-box error";
    fb.innerHTML = "<strong>❌ ไม่ถูกต้อง</strong> คำตอบที่ถูกคือ <strong>" + c.answer + "</strong><br>" + c.explanation;
  }
  document.getElementById("actionRow").style.display = "flex";
}

function nextRound() {
  round++;
  updateDots();
  if (round >= TOTAL) { showResult(); return; }
  renderCase(pickQuestion());
}

function showResult() {
  const pct = Math.round((score / TOTAL) * 100);
  let grade, gradeColor;
  if (pct >= 80) { grade = "🏆 ยอดเยี่ยม! นักสืบพันธุกรรมตัวจริง"; gradeColor = "#3b6d11"; }
  else if (pct >= 60) { grade = "👍 ดี! ทบทวนอีกนิดจะเก่งมาก"; gradeColor = "#854f0b"; }
  else { grade = "📚 ยังต้องฝึกอีก — ลองใหม่ได้เลย"; gradeColor = "#791f1f"; }
  document.getElementById("gameArea").innerHTML = `
    <div class="result-card">
      <div class="result-trophy">🧬</div>
      <div class="result-label">ผลคะแนนรวม</div>
      <div class="result-score">${score} / ${TOTAL}</div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-actions">
        <button class="btn-primary" onclick="restartGame()">เล่นใหม่</button>
      </div>
    </div>`;
}

function restartGame() {
  round = 0; score = 0; answered = false; usedIndexes = [];
  document.getElementById("scoreBadge").textContent = "คะแนน: 0";
  updateDots();
  renderCase(pickQuestion());
}

updateDots();
renderCase(pickQuestion());
</script>
