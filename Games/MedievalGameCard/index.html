<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Cards</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none hidden z-40"></canvas>

    <div id="chatLogContainer" class="fixed left-4 top-1/2 transform -translate-y-1/2 z-50 w-64 md:w-80 max-h-[60vh] flex flex-col-reverse gap-2 opacity-30 hover:opacity-100 transition-all duration-300 p-4 bg-black/40 rounded-2xl backdrop-blur-md border border-white/10 overflow-y-auto hidden">
    </div>

    <div id="app" class="w-full h-screen overflow-hidden relative box-border">
        
        <div id="startScreen" class="w-full h-full flex flex-col items-center justify-center p-6 text-center animate-fade-in">
            <div class="mb-4 text-7xl floating-icon" style="color:#7a5a8e;">⚔️</div>
            <div class="mb-8 w-full max-w-2xl px-4">
                <h1 class="medieval-title text-6xl md:text-8xl drop-shadow-title text-gold mb-2">Realm of Cards</h1>
                <p class="text-xl md:text-2xl text-white opacity-80 font-sans tracking-wide">เกมไพ่ยุคกลางแห่งกลยุทธ์และความรู้</p>
            </div>
            <h2 class="text-2xl font-semibold mb-6 font-sans text-gold bg-black/30 px-6 py-2 rounded-full border border-gold/30">เลือกจำนวนผู้เล่น</h2>
            <div class="flex gap-4 justify-center mb-8 flex-wrap max-w-3xl">
                <button onclick="initGame(1)" class="btn-menu">1 ต่อ Bot 🤖</button>
                <button onclick="initGame(2)" class="btn-menu">2 ผู้เล่น ⚔️</button>
                <button onclick="initGame(3)" class="btn-menu">3 ผู้เล่น 🛡️</button>
                <button onclick="initGame(4)" class="btn-menu">4 ผู้เล่น 👑</button>
            </div>
            <div class="text-sm md:text-base text-white opacity-60 flex flex-wrap gap-x-4 gap-y-2 justify-center font-sans max-w-2xl">
                <span>🎴 จั่วจาก 3 กอง</span><span>• ⚔️ อัศวินปกป้อง</span><span>• 🗡️ โจรขโมยลักษ์</span>
                <span>• 📖 บิชอปถามคำถาม</span><span>• 👑 กษัตริย์บังคับภาษี</span>
            </div>
        </div>

        <div id="gameScreen" class="w-full h-full hidden flex-col justify-between p-4 md:p-6 animate-fade-in box-border">
            <div id="topPlayers" class="player-row pl-20 md:pl-0"></div> 
            
            <div class="center-board relative flex-1 flex flex-col items-center justify-center min-h-[300px]">
                <div id="turnIndicator" class="font-sans text-2xl md:text-3xl font-bold text-gold mb-4 drop-shadow-md"></div>
                <div class="piles-container flex gap-6 md:gap-12 scale-90 md:scale-100">
                    <div class="pile-wrapper">
                        <div id="pile0" class="pile" onclick="handleDraw(0)"><div class="pile-symbol">⚜</div></div>
                        <div id="pileCount0" class="pile-count">15 cards</div>
                    </div>
                    <div class="pile-wrapper">
                        <div id="pile1" class="pile" onclick="handleDraw(1)"><div class="pile-symbol">⚜</div></div>
                        <div id="pileCount1" class="pile-count">15 cards</div>
                    </div>
                    <div class="pile-wrapper">
                        <div id="pile2" class="pile" onclick="handleDraw(2)"><div class="pile-symbol">⚜</div></div>
                        <div id="pileCount2" class="pile-count">15 cards</div>
                    </div>
                </div>
                <div id="drawnCardArea" class="h-44 flex items-center justify-center mt-4">
                    <div id="drawnCardDisplay"></div>
                </div>
            </div>

            <div id="bottomPlayers" class="player-row pl-20 md:pl-0"></div>
        </div>

        <div id="endTurnContainer" class="fixed bottom-6 right-6 md:bottom-10 md:right-10 z-50 hidden">
            <button id="endTurnBtn" class="btn-action bounce-in text-xl px-8 py-4 shadow-[0_0_20px_rgba(201,149,46,0.8)] border-2 border-white rounded-full" onclick="nextTurn()">จบเทิร์น ✅</button>
        </div>

        <div id="quizOverlay" class="overlay hidden z-50">
            <div class="quiz-box pop-in relative">
                <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 text-5xl">📖</div>
                <div class="medieval-title text-3xl text-gold mt-4 mb-2">บททดสอบแห่งบิชอป</div>
                <div id="quizTimer" class="timer text-4xl font-bold text-red-400 mb-4 drop-shadow-md">90</div>
                <div class="image-area border-2 border-gold/30 rounded-xl overflow-hidden">
                    <img id="questionImg" src="" class="hidden w-full h-full object-contain bg-black/50">
                    <p id="imgPlaceholder" class="font-sans text-white/50">🔍 ไม่พบรูปภาพประกอบ</p>
                </div>
                <p id="questionText" class="text-xl md:text-2xl mb-6 px-4 font-bold"></p>
                <div id="optionsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <div id="victoryOverlay" class="overlay hidden z-50">
            <div class="victory-box pop-in text-center p-8 bg-[#2a2035] border-4 border-gold rounded-3xl shadow-[0_0_50px_rgba(201,149,46,0.5)] max-w-2xl w-[90%]">
                <div class="text-6xl mb-4 animate-bounce">🏆</div>
                <h1 class="medieval-title text-5xl text-gold mb-2">มหาชัยชนะ!</h1>
                <p id="winnerName" class="text-4xl font-bold text-white mb-8 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]"></p>
                <div id="leaderboard" class="flex flex-col gap-3 mb-8 text-left font-sans text-lg"></div>
                <button onclick="location.reload()" class="btn-action text-2xl px-10 py-4 hover:scale-110 transition-transform">เล่นอีกครั้ง 🔄</button>
            </div>
        </div>

    </div>

    <script src="question.js"></script>
    <script src="game.js"></script>
</body>
</html>
