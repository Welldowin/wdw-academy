  <script>
// ===== Audio System (Web Audio API) =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playTone(freq, duration, type='sine', volume=0.3) {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duration);
}

function sfxCorrect() {
  playTone(523, 0.1); setTimeout(() => playTone(659, 0.1), 100); setTimeout(() => playTone(784, 0.15), 200);
}
function sfxWrong() {
  playTone(200, 0.3, 'sawtooth', 0.2);
}
function sfxCombo1() {
  playTone(600, 0.08); setTimeout(() => playTone(800, 0.08), 80); setTimeout(() => playTone(1000, 0.12), 160);
}
function sfxCombo2() {
  playTone(700, 0.08); setTimeout(() => playTone(900, 0.08), 70); setTimeout(() => playTone(1100, 0.08), 140); setTimeout(() => playTone(1300, 0.15), 210);
}
function sfxCombo3() {
  for(let i=0;i<5;i++) setTimeout(() => playTone(600+i*150, 0.08, 'square', 0.15), i*60);
}
function sfxWin() {
  const notes = [523,659,784,1047];
  notes.forEach((n,i) => setTimeout(() => playTone(n, 0.2, 'sine', 0.25), i*150));
}
function sfxLose() {
  playTone(400, 0.2, 'sawtooth', 0.2); setTimeout(() => playTone(300, 0.2, 'sawtooth', 0.2), 200); setTimeout(() => playTone(200, 0.4, 'sawtooth', 0.2), 400);
}

// ===== Game State =====
let playerName = '';
let difficulty = '';
let stage = 1;
let score = 0;
let combo = 0;
let correctCount = 0;
let timeLeft = 0;
let timer = null;
let currentAnswer = '';
let leaderboardData = [];
let questionStartTime = 0;

const stageTimes = [90, 75, 60, 45, 30];
const chibis = ['😺','🐶','🐰','🦊','🐼'];
const winChibis = ['🥳','🎊','💃','🕺','👑'];

// ===== Safe MathJax Renderer =====
let mathJaxPromise = Promise.resolve();
function renderMath() {
    if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
        mathJaxPromise = mathJaxPromise.then(() => MathJax.typesetPromise())
                         .catch(err => console.error('MathJax Error:', err));
    } else {
        setTimeout(renderMath, 100);
    }
}

// ===== Math / Trigonometry Data =====
const baseAnglesList = [0, 30, 37, 45, 53, 60, 90];
const normalAnglesList = [0, 30, 37, 45, 53, 60, 90, 120, 127, 135, 143, 150, 180, 210, 217, 225, 233, 240, 270, 300, 307, 315, 323, 330, 360];

const refAngles = {
    0: { sin: "0", cos: "1", tan: "0", csc: "\\text{หาค่าไม่ได้}", sec: "1", cot: "\\text{หาค่าไม่ได้}" },
    30: { sin: "\\frac{1}{2}", cos: "\\frac{\\sqrt{3}}{2}", tan: "\\frac{\\sqrt{3}}{3}", csc: "2", sec: "\\frac{2\\sqrt{3}}{3}", cot: "\\sqrt{3}" },
    37: { sin: "\\frac{3}{5}", cos: "\\frac{4}{5}", tan: "\\frac{3}{4}", csc: "\\frac{5}{3}", sec: "\\frac{5}{4}", cot: "\\frac{4}{3}" },
    45: { sin: "\\frac{\\sqrt{2}}{2}", cos: "\\frac{\\sqrt{2}}{2}", tan: "1", csc: "\\sqrt{2}", sec: "\\sqrt{2}", cot: "1" },
    53: { sin: "\\frac{4}{5}", cos: "\\frac{3}{5}", tan: "\\frac{4}{3}", csc: "\\frac{5}{4}", sec: "\\frac{5}{3}", cot: "\\frac{3}{4}" },
    60: { sin: "\\frac{\\sqrt{3}}{2}", cos: "\\frac{1}{2}", tan: "\\sqrt{3}", csc: "\\frac{2\\sqrt{3}}{3}", sec: "2", cot: "\\frac{\\sqrt{3}}{3}" },
    90: { sin: "1", cos: "0", tan: "\\text{หาค่าไม่ได้}", csc: "1", sec: "\\text{หาค่าไม่ได้}", cot: "0" }
};

function applySign(str, sign) {
    if (str === "0" || str === "\\text{หาค่าไม่ได้}") return str;
    if (sign < 0) {
        if (str.startsWith("-")) return str.substring(1); // prevent --
        return "-" + str;
    }
    return str;
}

function getFullTrig(func, angle) {
    angle = angle % 360;
    if (angle < 0) angle += 360;
    
    let quad = 1, ref = 0;
    if (angle >= 0 && angle <= 90) { quad = 1; ref = angle; }
    else if (angle > 90 && angle <= 180) { quad = 2; ref = 180 - angle; }
    else if (angle > 180 && angle <= 270) { quad = 3; ref = angle - 180; }
    else { quad = 4; ref = 360 - angle; }
    
    // Boundary exceptions override
    if (angle === 90) { quad = 1; ref = 90; }
    if (angle === 180) { quad = 2; ref = 0; }
    if (angle === 270) { quad = 3; ref = 90; }
    
    let sign = 1;
    if (quad === 2) {
        if (func !== 'sin' && func !== 'csc') sign = -1;
    } else if (quad === 3) {
        if (func !== 'tan' && func !== 'cot') sign = -1;
    } else if (quad === 4) {
        if (func !== 'cos' && func !== 'sec') sign = -1;
    }
    
    return applySign(refAngles[ref][func], sign);
}

// ===== Elements =====
const $ = id => document.getElementById(id);

// ===== Screens =====
function showScreen(name) {
  ['screen-name','screen-difficulty','screen-game'].forEach(s => {
    $(s).classList.add('hidden');
    $(s).classList.remove('flex');
  });
  $(name).classList.remove('hidden');
  $(name).classList.add('flex');
}

function setButtonsState(disabled) {
    document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.disabled = disabled;
    });
}

// ===== Name Screen =====
$('btn-start').onclick = () => {
  const name = $('player-name').value.trim();
  if (!name) { $('name-error').classList.remove('hidden'); return; }
  $('name-error').classList.add('hidden');
  playerName = name;
  showScreen('screen-difficulty');
};
$('player-name').addEventListener('keydown', e => { if(e.key==='Enter') $('btn-start').click(); });

// ===== Difficulty =====
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.onclick = () => {
    difficulty = btn.dataset.diff;
    stage = 1; score = 0;
    startStage();
  };
});

// ===== Generate Question =====
function generateQuestion() {
  let allowedFuncs, allowedAngles;
  if (difficulty === 'easy') {
      allowedFuncs = ['sin', 'cos', 'tan'];
      allowedAngles = baseAnglesList;
  } else if (difficulty === 'normal') {
      allowedFuncs = ['sin', 'cos', 'tan'];
      allowedAngles = normalAnglesList;
  } else {
      allowedFuncs = ['sin', 'cos', 'tan', 'csc', 'sec', 'cot'];
      allowedAngles = normalAnglesList;
  }
  
  const qFunc = allowedFuncs[Math.floor(Math.random() * allowedFuncs.length)];
  const qAngle = allowedAngles[Math.floor(Math.random() * allowedAngles.length)];
  
  currentAnswer = getFullTrig(qFunc, qAngle);
  
  // Create unique options
  let options = [currentAnswer];
  let maxAttempts = 100;
  while (options.length < 4 && maxAttempts > 0) {
      let rf = allowedFuncs[Math.floor(Math.random() * allowedFuncs.length)];
      let ra = allowedAngles[Math.floor(Math.random() * allowedAngles.length)];
      let wrongStr = getFullTrig(rf, ra);
      if (!options.includes(wrongStr)) {
          options.push(wrongStr);
      }
      maxAttempts--;
  }
  
  // Shuffle options
  options.sort(() => Math.random() - 0.5);
  
  // Format operator for latex (e.g., \sin)
  let latexFunc = `\\${qFunc}`; 
  $('question').innerHTML = `\\(${latexFunc}(${qAngle}^\\circ) = ?\\)`;
  $('question').className = 'text-4xl font-black text-gray-800 mb-6 animate-slide-up flex items-center justify-center min-h-[60px]';
  
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, idx) => {
      btn.dataset.val = options[idx];
      btn.innerHTML = `\\(${options[idx]}\\)`;
  });
  
  renderMath();
  questionStartTime = Date.now();
  setButtonsState(false);
}

// ===== Start Stage =====
function startStage() {
  showScreen('screen-game');
  correctCount = 0;
  combo = 0;
  timeLeft = stageTimes[stage-1];
  $('stage-display').textContent = `${stage}/5`;
  $('score-display').textContent = score;
  $('time-display').textContent = timeLeft;
  $('correct-count').textContent = '0';
  $('progress-bar').style.width = '0%';
  $('combo-display').classList.add('hidden');
  $('chibi-game').textContent = chibis[stage-1];
  $('feedback').innerHTML = '';
  
  generateQuestion();
  
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    $('time-display').textContent = timeLeft;
    if (timeLeft <= 10) $('time-display').classList.add('text-red-600','animate-pulse-glow');
    else $('time-display').classList.remove('animate-pulse-glow');
    if (timeLeft <= 0) {
      clearInterval(timer);
      sfxLose();
      showModal('lose');
    }
  }, 1000);
}

// ===== Answer Handling =====
document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.onclick = (e) => {
        submitAnswer(e.currentTarget.dataset.val);
    };
});

function submitAnswer(val) {
  setButtonsState(true);
  const elapsed = (Date.now() - questionStartTime) / 1000;
  
  if (val === currentAnswer) {
    // Correct
    correctCount++;
    combo++;
    
    // Score: speed bonus + combo bonus
    const speedBonus = Math.max(10, Math.round(50 - elapsed * 2));
    const comboBonus = combo >= 2 ? combo * 5 : 0;
    score += speedBonus + comboBonus;
    
    sfxCorrect();
    if (combo >= 5) sfxCombo3();
    else if (combo >= 3) sfxCombo2();
    else if (combo >= 2) sfxCombo1();
    
    // Time bonus at combo >= 3
    if (combo >= 3) {
      timeLeft += 5;
      $('time-display').textContent = timeLeft;
      const tb = $('time-bonus-anim');
      tb.classList.remove('hidden');
      tb.style.animation = 'none';
      tb.offsetHeight;
      tb.style.animation = '';
      setTimeout(() => tb.classList.add('hidden'), 1000);
    }
    
    // UI
    $('chibi-game').textContent = '😸';
    $('feedback').innerHTML = '✅ ถูกต้อง!';
    $('feedback').className = 'text-lg font-black h-8 text-green-500 animate-bounce-in flex justify-center items-center';
    
    if (combo >= 2) {
      $('combo-display').classList.remove('hidden');
      $('combo-count').textContent = combo;
      $('combo-display').firstElementChild.className = 'inline-block bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-4 py-1 rounded-full font-black text-sm animate-combo';
    }
    
    $('score-display').textContent = score;
    $('correct-count').textContent = correctCount;
    $('progress-bar').style.width = `${correctCount*10}%`;
    
    if (correctCount >= 10) {
      clearInterval(timer);
      score += timeLeft * 2; // Bonus for remaining time
      $('score-display').textContent = score;
      sfxWin();
      if (stage >= 5) {
        showModal('winner');
        saveScore();
      } else {
        showModal('stage-clear');
      }
      return;
    }
    
    setTimeout(() => { $('chibi-game').textContent = chibis[stage-1]; }, 500);
    setTimeout(() => { generateQuestion(); }, 800);
    
  } else {
    // Wrong
    combo = 0;
    score = Math.max(0, score - 10);
    $('combo-display').classList.add('hidden');
    sfxWrong();
    $('chibi-game').textContent = '🙀';
    
    // Display correct answer using MathJax
    $('feedback').innerHTML = `❌ คำตอบคือ \\(${currentAnswer}\\)`;
    $('feedback').className = 'text-lg font-black h-8 text-red-500 animate-shake flex justify-center items-center';
    renderMath(); // Render the correct answer feedback
    
    $('score-display').textContent = score;
    setTimeout(() => { 
        $('chibi-game').textContent = chibis[stage-1]; 
        generateQuestion(); 
    }, 1500); // Give user time to read the correct math answer
  }
}

// ===== Modal =====
function showModal(type) {
  $('modal').classList.remove('hidden');
  const btns = $('modal-buttons');
  btns.innerHTML = '';
  
  if (type === 'lose') {
    $('modal-icon').textContent = '😢';
    $('modal-title').textContent = 'LOSE!!';
    $('modal-text').textContent = 'พยายามใหม่อีกครั้ง';
    $('modal-score').textContent = `คะแนน: ${score}`;
    btns.innerHTML = `<button class="btn-cute bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-full px-6 py-3 w-full" onclick="restartGame()">เริ่มเกมใหม่ 🔄</button>`;
  } else if (type === 'stage-clear') {
    $('modal-icon').textContent = winChibis[stage-1];
    $('modal-title').textContent = `ด่าน ${stage} ผ่าน!`;
    $('modal-text').textContent = 'เก่งมาก! ไปด่านถัดไปกันเลย!';
    $('modal-score').textContent = `คะแนนรวม: ${score}`;
    spawnConfetti();
    btns.innerHTML = `
      <button class="btn-cute bg-gradient-to-r from-green-400 to-emerald-500 text-white rounded-full px-6 py-3 w-full" onclick="nextStage()">เข้าสู่ด่านถัดไป ➡️</button>
      <button class="btn-cute bg-gray-300 text-gray-700 rounded-full px-6 py-3 w-full" onclick="restartGame()">เริ่มเกมใหม่ 🔄</button>`;
  } else if (type === 'winner') {
    $('modal-icon').textContent = '👑';
    $('modal-title').textContent = 'WINNER!!';
    $('modal-text').textContent = 'ยินดีด้วย คุณชนะแล้ว!';
    $('modal-score').textContent = `คะแนนรวม: ${score}`;
    spawnConfetti();
    btns.innerHTML = `<button class="btn-cute bg-gradient-to-r from-yellow-400 to-orange-500 rounded-full text-white px-6 py-3 w-full" onclick="restartGame()">เริ่มเกมใหม่ 🎮</button>`;
  }
}

function nextStage() {
  $('modal').classList.add('hidden');
  stage++;
  startStage();
}

function restartGame() {
  $('modal').classList.add('hidden');
  clearInterval(timer);
  showScreen('screen-name');
}

// ===== Confetti =====
function spawnConfetti() {
  const container = $('confetti-container');
  container.innerHTML = '';
  const colors = ['#ff6b9d','#ffd93d','#6bcb77','#4d96ff','#ff6b6b','#a855f7'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = Math.random()*0.5 + 's';
    piece.style.borderRadius = Math.random()>0.5 ? '50%' : '0';
    container.appendChild(piece);
  }
  setTimeout(() => container.innerHTML = '', 3000);
}

// ===== Data SDK =====
async function saveScore() {
  if (leaderboardData.length >= 999) return;
  if(window.dataSdk){
      const result = await window.dataSdk.create({
        player_name: playerName,
        score: score,
        difficulty: difficulty,
        completed_at: new Date().toISOString()
      });
  }
}

const dataHandler = {
  onDataChanged(data) {
    leaderboardData = data;
    renderLeaderboard(data);
  }
};

function renderLeaderboard(data) {
  const difficulties = ['easy', 'normal', 'hard'];
  
  difficulties.forEach(diff => {
    const filtered = [...data].filter(r => r.difficulty === diff).sort((a,b) => (b.score||0) - (a.score||0)).slice(0, 3);
    const container = $('leaderboard-' + diff);
    
    if (!filtered.length) {
      container.innerHTML = '<p class="text-gray-400 text-xs">ยังไม่มีคะแนน</p>';
      return;
    }
    
    container.innerHTML = filtered.map((r,i) => {
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ';
      return `<div class="flex justify-between items-center py-0.5 px-1 rounded bg-yellow-50"><span class="truncate">${medal} ${r.player_name}</span><span class="font-bold text-yellow-600 ml-1">${r.score}pts</span></div>`;
    }).join('');
  });
}

// ===== Element SDK =====
const defaultConfig = {
  game_title: '✨ Trigono Quest ✨',
  background_color: '#fff4e0',
  surface_color: '#ffffff',
  text_color: '#6b21a8',
  primary_action_color: '#a855f7',
  secondary_action_color: '#ec4899',
  font_family: 'Nunito',
  font_size: 16
};

if(window.elementSdk){
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        const title = config.game_title || defaultConfig.game_title;
        $('title-display').textContent = title;
        
        const bg = config.background_color || defaultConfig.background_color;
        document.querySelector('.star-bg').style.background = `radial-gradient(circle at 20% 30%, ${bg}, #ffe0f0 40%, #e0f0ff 70%, #f0ffe0)`;
        
        const txt = config.text_color || defaultConfig.text_color;
        document.querySelectorAll('h1,h2').forEach(el => el.style.color = txt);
        
        const font = config.font_family || defaultConfig.font_family;
        document.body.style.fontFamily = `${font}, Nunito, sans-serif`;
        
        const size = config.font_size || defaultConfig.font_size;
        document.body.style.fontSize = size + 'px';
      },
      mapToCapabilities: (config) => ({
        recolorables: [
          { get: () => config.background_color || defaultConfig.background_color, set: v => { config.background_color = v; window.elementSdk.setConfig({background_color:v}); }},
          { get: () => config.surface_color || defaultConfig.surface_color, set: v => { config.surface_color = v; window.elementSdk.setConfig({surface_color:v}); }},
          { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({text_color:v}); }},
          { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: v => { config.primary_action_color = v; window.elementSdk.setConfig({primary_action_color:v}); }},
          { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: v => { config.secondary_action_color = v; window.elementSdk.setConfig({secondary_action_color:v}); }},
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: v => { config.font_family = v; window.elementSdk.setConfig({font_family:v}); }},
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: v => { config.font_size = v; window.elementSdk.setConfig({font_size:v}); }}
      }),
      mapToEditPanelValues: (config) => new Map([
        ['game_title', config.game_title || defaultConfig.game_title]
      ])
    });
}

// Init Data SDK
(async () => {
  if(window.dataSdk){
      await window.dataSdk.init(dataHandler);
  }
})();

if(window.lucide){ lucide.createIcons(); }
