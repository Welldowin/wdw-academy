<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจข้อสอบ : Final Test ฟิสิกส์ ม.2 บทที่ 3</title>
<script>
  window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body { font-family: 'Kanit', 'Tahoma', sans-serif; background: #fffdf5; color: #1f2937; margin: 0; padding: 16px; line-height: 1.7; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { color: #1E3D8F; font-size: 1.4rem; margin: 0 0 4px; }
  .bar { position: sticky; top: 0; background: #fffdf5; padding: 10px 0; border-bottom: 2px solid #FFF173; z-index: 5; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .bar label { font-size: .95rem; cursor: pointer; }
  .summary { font-size: .9rem; color: #475569; }
  .q { background: #fff; border: 1px solid #dbe3f0; border-radius: 12px; padding: 16px 18px; margin: 16px 0; box-shadow: 0 4px 14px rgba(30,61,143,.06); break-inside: avoid; }
  .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: #1E3D8F; margin-bottom: 8px; }
  .tag { background: #dbe7f7; padding: 2px 10px; border-radius: 999px; }
  .prompt { white-space: normal; }
  .q img { max-width: 100%; border: 1px solid #ccc; border-radius: 8px; margin: 10px 0; }
  .choice { padding: 6px 12px; margin: 4px 0; border: 1px solid #e5e7eb; border-radius: 8px; }
  .choice.ans { background: #dcfce7; border-color: #16a34a; font-weight: 600; }
  body.hide-ans .choice.ans { background: none; border-color: #e5e7eb; font-weight: 400; }
  .ok { color: #16a34a; margin-left: 6px; }
  body.hide-ans .ok { display: none; }
  .note { margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 6px; font-size: .9rem; color: #475569; }
  body.hide-ans .note { display: none; }
  @media print { .bar { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">ตรวจข้อสอบ</h1>
  <div class="bar">
    <label><input type="checkbox" id="toggle-ans" checked> แสดงเฉลย</label>
    <label>กรอง:
      <select id="filter">
        <option value="">ทุกข้อ</option>
        <option value="Vector">เวกเตอร์</option>
        <option value="Mass">ระบบมวลราบและดิ่ง</option>
        <option value="Friction">แรงเสียดทาน</option>
        <option value="Incline">พื้นเอียง</option>
        <option value="img">เฉพาะข้อที่มีรูป</option>
      </select>
    </label>
    <span class="summary" id="summary"></span>
  </div>
  <div id="list"></div>
</div>

<script src="questions.js"></script>
<script>
  const SKILL = { theory: 'ทฤษฎี', calc: 'คำนวณ', apply: 'ประยุกต์' };
  const CHAP = { Vector: 'เวกเตอร์', Mass: 'ระบบมวลราบและดิ่ง', Friction: 'แรงเสียดทาน', Incline: 'พื้นเอียง' };
  document.getElementById('title').textContent = 'ตรวจข้อสอบ: ' + QUIZ_META.title;

  function render() {
    const f = document.getElementById('filter').value;
    const rows = QUIZ_DATA.map((q, i) => ({ q, i })).filter(({ q }) => !f || (f === 'img' ? q.image : q.chapter === f));
    document.getElementById('summary').textContent = `แสดง ${rows.length} / ${QUIZ_DATA.length} ข้อ`;
    document.getElementById('list').innerHTML = rows.map(({ q, i }) => `
      <div class="q">
        <div class="meta"><strong>ข้อที่ ${i + 1}</strong>
          <span><span class="tag">${CHAP[q.chapter]}</span> <span class="tag">${SKILL[q.skill]}</span> <span class="tag">${q.subtopic}</span></span></div>
        <div class="prompt">${q.prompt.replace(/\\n/g, '<br>').replace(/\n/g, '<br>')}</div>
        ${q.image ? `<img src="${q.image}" alt="รูปประกอบข้อ ${i + 1}">` : ''}
        ${q.choices.map(c => `<div class="choice ${c.key === q.answer ? 'ans' : ''}">${c.key}) ${c.text}${c.key === q.answer ? '<span class="ok"> ✓ เฉลย</span>' : ''}</div>`).join('')}
        <div class="note">id: ${q.id} · เฉลยข้อ ${q.answer}</div>
      </div>`).join('');
    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
  }
  document.getElementById('filter').addEventListener('change', render);
  document.getElementById('toggle-ans').addEventListener('change', e => document.body.classList.toggle('hide-ans', !e.target.checked));
  render();
  window.addEventListener('load', () => MathJax.startup && MathJax.startup.promise.then(() => MathJax.typesetPromise()));
</script>
</body>
</html>
