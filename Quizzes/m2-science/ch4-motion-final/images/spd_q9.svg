<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 214" width="420" height="214" font-family="Kanit, Tahoma, sans-serif" font-size="13"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3D8F"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D94C4C"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="420" height="214" fill="#ffffff"/><line x1="60" y1="120" x2="360" y2="120" stroke="#94a3b8" stroke-width="6" /><circle cx="60" cy="120" r="7" fill="#1f2937"/><circle cx="360" cy="120" r="7" fill="#1f2937"/><text x="60" y="148" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="400">A</text><text x="360" y="148" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="400">B</text><line x1="76" y1="98" x2="344" y2="98" stroke="#1E3D8F" stroke-width="3" marker-end="url(#ab)"/><text x="210" y="86" text-anchor="middle" fill="#1E3D8F" font-size="13" font-weight="600">ขาไป A → B  ความเร็ว 60 km/h</text><line x1="344" y1="168" x2="76" y2="168" stroke="#D94C4C" stroke-width="3" marker-end="url(#ar)"/><text x="210" y="192" text-anchor="middle" fill="#D94C4C" font-size="13" font-weight="600">ขากลับ B → A  ความเร็ว 40 km/h</text><line x1="60" y1="40" x2="360" y2="40" stroke="#475569" stroke-width="1.5" marker-start="url(#ag)" marker-end="url(#ag)"/><text x="210" y="32" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">ระยะทาง AB = 12 km</text></svg>