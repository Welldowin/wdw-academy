<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard</title>
  <link rel="stylesheet" href="./leaderboard.css" />
</head>
<body>
  <div class="page">
    <section class="card hero-card">
      <div class="hero-wrap">
        <div class="hero-left">
          <img src="./assets/logo-wdw.png" alt="WDW Logo" class="brand-logo" />
          <div>
            <h1 id="lbTitle">🏆 WDW Leaderboard</h1>
            <p class="muted">จัดอันดับตามคะแนนมากไปน้อย ถ้าคะแนนเท่ากัน คนที่ใช้เวลาน้อยกว่าจะอยู่อันดับสูงกว่า</p>
          </div>
        </div>
      </div>
    </section>

    <section class="card" id="myResultCard">
      <h2>ผลล่าสุดของคุณ</h2>
      <div class="summary-grid" id="mySummary"></div>
      <div class="actions">
        <a class="btn primary" id="reviewBtn" href="./quiz.html">ดูคำตอบของฉัน</a>
      </div>
    </section>

    <section class="card">
      <h2>ตารางคะแนน</h2>
      <table>
        <thead>
          <tr>
            <th>อันดับ</th>
            <th>เหรียญ</th>
            <th>Name</th>
            <th>คะแนน</th>
            <th>เวลา</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="5">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./leaderboard.js"></script>
</body>
</html>
