<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>

  <!-- incoming plane waves -->
  <g stroke="#2563eb" stroke-width="1.5">
    <line x1="15" y1="30" x2="15" y2="310"/>
    <line x1="40" y1="30" x2="40" y2="310"/>
    <line x1="65" y1="30" x2="65" y2="310"/>
  </g>
  <line x1="65" y1="170" x2="95" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- grating: many slits -->
  <g fill="#1f2937">
    <rect x="105" y="20" width="10" height="18"/>
    <rect x="105" y="52" width="10" height="18"/>
    <rect x="105" y="84" width="10" height="18"/>
    <rect x="105" y="116" width="10" height="18"/>
    <rect x="105" y="148" width="10" height="18"/>
    <rect x="105" y="180" width="10" height="18"/>
    <rect x="105" y="212" width="10" height="18"/>
    <rect x="105" y="244" width="10" height="18"/>
    <rect x="105" y="276" width="10" height="18"/>
  </g>
  <text x="110" y="14" text-anchor="middle" font-size="13" fill="#1f2937">เกรตติ้ง (ช่องเรียงถี่)</text>

  <!-- d spacing label -->
  <line x1="140" y1="148" x2="140" y2="180" stroke="#dc2626" stroke-width="1.3"/>
  <text x="155" y="168" font-size="12" fill="#dc2626">d</text>

  <!-- diffracted orders -->
  <g stroke-width="1.6" fill="none">
    <line x1="115" y1="170" x2="560" y2="170" stroke="#16a34a"/>
    <line x1="115" y1="170" x2="560" y2="100" stroke="#f59e0b"/>
    <line x1="115" y1="170" x2="560" y2="45" stroke="#dc2626"/>
    <line x1="115" y1="170" x2="560" y2="240" stroke="#f59e0b"/>
    <line x1="115" y1="170" x2="560" y2="295" stroke="#dc2626"/>
  </g>

  <!-- screen -->
  <rect x="560" y="20" width="8" height="300" fill="#374151"/>
  <text x="564" y="14" text-anchor="middle" font-size="13" fill="#374151">ฉาก</text>

  <!-- bright dots on screen -->
  <circle cx="564" cy="170" r="4" fill="#16a34a"/>
  <circle cx="564" cy="100" r="4" fill="#f59e0b"/>
  <circle cx="564" cy="45" r="4" fill="#dc2626"/>
  <circle cx="564" cy="240" r="4" fill="#f59e0b"/>
  <circle cx="564" cy="295" r="4" fill="#dc2626"/>

  <text x="575" y="174" font-size="11" fill="#16a34a">n=0</text>
  <text x="575" y="104" font-size="11" fill="#f59e0b">n=1</text>
  <text x="575" y="49" font-size="11" fill="#dc2626">n=2</text>

  <text x="320" y="330" text-anchor="middle" font-size="12" fill="#374151">d sinθ = nλ — มุมเลี้ยวเบนต่างกันตามลำดับ (n) และความยาวคลื่น (สี)</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
