<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="560" height="260" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#111827" font-weight="bold">ร้อยละผลได้ของ NH₃ ในกระบวนการฮาเบอร์</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#374151">N₂(g) + 3H₂(g) ⇌ 2NH₃(g) + พลังงาน</text>

  <g stroke="#374151" stroke-width="1">
    <line x1="60" y1="65" x2="500" y2="65"/>
    <line x1="60" y1="100" x2="500" y2="100"/>
    <line x1="60" y1="135" x2="500" y2="135"/>
    <line x1="60" y1="170" x2="500" y2="170"/>
    <line x1="60" y1="65" x2="60" y2="170"/>
    <line x1="200" y1="65" x2="200" y2="170"/>
    <line x1="350" y1="65" x2="350" y2="170"/>
    <line x1="500" y1="65" x2="500" y2="170"/>
  </g>

  <g font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">
    <text x="130" y="87">สภาวะ</text>
    <text x="275" y="87">อุณหภูมิ</text>
    <text x="425" y="87">ความดัน</text>
  </g>
  <g font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="130" y="122">ผลได้สูงสุด</text>
    <text x="275" y="122">ต่ำ (~200°C)</text>
    <text x="425" y="122">สูง (~400 atm)</text>

    <text x="130" y="157">ผลได้ต่ำสุด</text>
    <text x="275" y="157">สูง</text>
    <text x="425" y="157">ต่ำ</text>
  </g>

  <text x="280" y="195" text-anchor="middle" font-size="12" fill="#6b7280">(ทฤษฎี: T ต่ำ + P สูง ให้ %ผลได้สูงสุด)</text>
  <text x="280" y="215" text-anchor="middle" font-size="12" fill="#6b7280">อุตสาหกรรมจริงใช้ T ปานกลาง + ตัวเร่งปฏิกิริยา (ผงเหล็ก) เพื่อความคุ้มทุน</text>
</svg>
