<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <!-- air region -->
  <rect x="0" y="0" width="560" height="90" fill="#eff6ff"/>
  <!-- water region -->
  <rect x="0" y="90" width="560" height="250" fill="#bfdbfe"/>
  <line x1="0" y1="90" x2="560" y2="90" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="10" y="20" font-size="12" fill="#1e3a8a">อากาศ (n=1)</text>
  <text x="10" y="330" font-size="12" fill="#1e3a8a">น้ำ (n=4/3)</text>

  <!-- observer eye -->
  <circle cx="380" cy="45" r="10" fill="#374151"/>
  <text x="380" y="25" text-anchor="middle" font-size="12" fill="#374151">ผู้สังเกต</text>

  <!-- normal line -->
  <line x1="300" y1="0" x2="300" y2="340" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- real object depth (solid) -->
  <circle cx="300" cy="280" r="7" fill="#111827"/>
  <text x="330" y="284" font-size="12" fill="#111827">วัตถุจริง (ลึกจริง)</text>
  <line x1="300" y1="90" x2="300" y2="280" stroke="#111827" stroke-width="1.2"/>

  <!-- refracted ray from object to eye -->
  <line x1="300" y1="280" x2="300" y2="90" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="300" y1="90" x2="380" y2="45" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowE)"/>

  <!-- apparent (virtual) image position - shallower, dashed back-projection -->
  <circle cx="300" cy="160" r="7" fill="#7c3aed" opacity="0.85"/>
  <text x="330" y="164" font-size="12" fill="#7c3aed">ภาพปรากฏ (ลึกปรากฏ, ตื้นกว่าจริง)</text>
  <line x1="380" y1="45" x2="300" y2="160" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- depth measurement brackets -->
  <line x1="250" y1="90" x2="250" y2="280" stroke="#111827" stroke-width="1"/>
  <line x1="245" y1="90" x2="255" y2="90" stroke="#111827" stroke-width="1"/>
  <line x1="245" y1="280" x2="255" y2="280" stroke="#111827" stroke-width="1"/>
  <text x="225" y="190" text-anchor="middle" font-size="12" fill="#111827" transform="rotate(-90 225 190)">ลึกจริง</text>

  <line x1="220" y1="90" x2="220" y2="160" stroke="#7c3aed" stroke-width="1"/>
  <line x1="215" y1="90" x2="225" y2="90" stroke="#7c3aed" stroke-width="1"/>
  <line x1="215" y1="160" x2="225" y2="160" stroke="#7c3aed" stroke-width="1"/>
  <text x="195" y="128" text-anchor="middle" font-size="11" fill="#7c3aed" transform="rotate(-90 195 128)">ลึกปรากฏ</text>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#1f2937">ลึกปรากฏ / ลึกจริง = n(ผู้สังเกต) / n(วัตถุ)</text>

  <defs>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
