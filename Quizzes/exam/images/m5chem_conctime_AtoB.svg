<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <line x1="60" y1="290" x2="530" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#ax1)"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="#374151" stroke-width="1.5" marker-end="url(#ax1)"/>
  <text x="300" y="320" text-anchor="middle" font-size="14" fill="#374151">เวลา (t)</text>
  <text x="25" y="160" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 25 160)">ความเข้มข้น</text>
  <text x="150" y="20" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">ปฏิกิริยา A → B</text>

  <!-- Curve A: decreasing, flattening -->
  <path d="M75,60 C 150,90 200,180 260,220 C 330,255 420,268 520,270" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="90" y="55" font-size="13" fill="#dc2626" font-weight="bold">A</text>

  <!-- Curve B: increasing, flattening -->
  <path d="M75,270 C 150,250 200,160 260,120 C 330,80 420,65 520,60" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="52" font-size="13" fill="#2563eb" font-weight="bold">B</text>

  <!-- tangent line illustration at some point on A -->
  <line x1="180" y1="210" x2="250" y2="130" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="195" y="200" font-size="11" fill="#059669">เส้นสัมผัสที่เวลา t (หาความชัน)</text>
  <circle cx="215" cy="170" r="4" fill="#059669"/>

  <defs>
    <marker id="ax1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
</svg>
