<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="600" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="60" y1="300" x2="560" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#axArrow)"/>
  <line x1="60" y1="300" x2="60" y2="30" stroke="#374151" stroke-width="1.5" marker-end="url(#axArrow)"/>
  <text x="300" y="335" text-anchor="middle" font-size="14" fill="#374151">การดำเนินไปของปฏิกิริยา</text>
  <text x="25" y="165" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 25 165)">พลังงานศักย์</text>

  <!-- curve: reactant flat -> hump1 (tall) -> valley (intermediate) -> hump2 (lower) -> product flat (lower than reactant) -->
  <path d="M80,220 L140,220
           C 180,220 190,80 230,80
           C 250,80 260,190 290,190
           C 310,190 320,140 350,140
           C 370,140 385,240 420,240
           L 520,240"
        fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- dashed level lines -->
  <line x1="80" y1="220" x2="520" y2="220" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="80" y1="240" x2="520" y2="240" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- labels -->
  <text x="90" y="212" font-size="13" fill="#111827">สารตั้งต้น</text>
  <text x="430" y="255" font-size="13" fill="#111827">ผลิตภัณฑ์</text>
  <text x="200" y="72" text-anchor="middle" font-size="12" fill="#b91c1c">ยอดเขา 1 (สูงกว่า)</text>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#b91c1c">ยอดเขา 2</text>
  <text x="270" y="205" text-anchor="middle" font-size="11" fill="#7c3aed">สารมัธยันตร์ (หุบเขา)</text>
  <circle cx="290" cy="190" r="4" fill="#7c3aed"/>

  <!-- Ea1 and Ea2 vertical arrows -->
  <line x1="140" y1="220" x2="140" y2="80" stroke="#059669" stroke-width="1.3" marker-end="url(#axArrow2)"/>
  <text x="115" y="150" font-size="11" fill="#059669">Ea1</text>
  <line x1="350" y1="240" x2="350" y2="140" stroke="#2563eb" stroke-width="1.3" marker-end="url(#axArrow2)"/>
  <text x="358" y="195" font-size="11" fill="#2563eb">Ea2</text>

  <defs>
    <marker id="axArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
    <marker id="axArrow2" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#059669"/></marker>
  </defs>
</svg>
