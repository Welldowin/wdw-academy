<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="640" height="320" fill="#ffffff"/>
  <line x1="20" y1="160" x2="620" y2="160" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- object -->
  <line x1="60" y1="160" x2="60" y2="120" stroke="#374151" stroke-width="2" marker-end="url(#arrowUp3)"/>
  <text x="60" y="112" text-anchor="middle" font-size="11" fill="#374151">วัตถุ</text>

  <!-- objective lens -->
  <ellipse cx="180" cy="160" rx="9" ry="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="252" text-anchor="middle" font-size="12" fill="#1d4ed8">เลนส์ใกล้วัตถุ (M₁=−10)</text>

  <!-- rays from object top through lens to real image -->
  <g stroke="#f59e0b" stroke-width="1.3">
    <line x1="60" y1="120" x2="180" y2="95"/>
    <line x1="180" y1="95" x2="340" y2="215"/>
    <line x1="60" y1="120" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="340" y2="215"/>
  </g>

  <!-- real inverted intermediate image -->
  <line x1="340" y1="160" x2="340" y2="215" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowDown3)"/>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#dc2626">ภาพจริง หัวกลับ ขยาย</text>

  <!-- eyepiece lens -->
  <ellipse cx="440" cy="160" rx="8" ry="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="440" y="242" text-anchor="middle" font-size="12" fill="#16a34a">เลนส์ใกล้ตา (M₂=+5)</text>

  <!-- rays diverging to eye, dashed back-projection to virtual image -->
  <g stroke="#7c3aed" stroke-width="1.3">
    <line x1="340" y1="215" x2="440" y2="130"/>
    <line x1="440" y1="130" x2="600" y2="70"/>
    <line x1="340" y1="215" x2="440" y2="180"/>
    <line x1="440" y1="180" x2="600" y2="200"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3">
    <line x1="600" y1="70" x2="60" y2="20"/>
    <line x1="600" y1="200" x2="60" y2="300"/>
  </g>
  <line x1="60" y1="20" x2="60" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowUp3v)"/>
  <text x="95" y="20" font-size="11" fill="#7c3aed">ภาพเสมือน ขนาดใหญ่มาก (มองเห็นโดยตา)</text>

  <text x="320" y="30" text-anchor="middle" font-size="13" fill="#1f2937">กล้องจุลทรรศน์: M รวม = M₁ × M₂ = (−10)×(+5) = −50 เท่า</text>

  <defs>
    <marker id="arrowUp3" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto"><path d="M0,6 L3,0 L6,6 Z" fill="#374151"/></marker>
    <marker id="arrowDown3" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto"><path d="M0,0 L3,6 L6,0 Z" fill="#dc2626"/></marker>
    <marker id="arrowUp3v" markerWidth="8" markerHeight="8" refX="3" refY="0" orient="auto"><path d="M0,6 L3,0 L6,6 Z" fill="#7c3aed"/></marker>
  </defs>
</svg>
