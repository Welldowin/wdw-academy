<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>

  <!-- incoming plane waves -->
  <g stroke="#2563eb" stroke-width="1.5" fill="none">
    <line x1="20" y1="60" x2="20" y2="280"/>
    <line x1="45" y1="60" x2="45" y2="280"/>
    <line x1="70" y1="60" x2="70" y2="280"/>
  </g>
  <g>
    <line x1="70" y1="90" x2="100" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow1)"/>
    <line x1="70" y1="250" x2="100" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow1)"/>
  </g>

  <!-- barrier with slit -->
  <rect x="110" y="30" width="14" height="120" fill="#1f2937"/>
  <rect x="110" y="190" width="14" height="120" fill="#1f2937"/>
  <text x="117" y="20" text-anchor="middle" font-size="13" fill="#1f2937">แผ่นกั้น</text>

  <!-- slit width label -->
  <line x1="105" y1="155" x2="105" y2="185" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="129" y1="155" x2="129" y2="185" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="105" y1="170" x2="129" y2="170" stroke="#dc2626" stroke-width="1.5"/>
  <text x="117" y="182" text-anchor="middle" font-size="13" fill="#dc2626">a</text>

  <!-- diffracted rays fanning out -->
  <g stroke="#f59e0b" stroke-width="1.3" opacity="0.9">
    <line x1="124" y1="170" x2="480" y2="70"/>
    <line x1="124" y1="170" x2="480" y2="115"/>
    <line x1="124" y1="170" x2="480" y2="170"/>
    <line x1="124" y1="170" x2="480" y2="225"/>
    <line x1="124" y1="170" x2="480" y2="270"/>
  </g>

  <!-- screen -->
  <rect x="480" y="30" width="8" height="280" fill="#374151"/>
  <text x="484" y="20" text-anchor="middle" font-size="13" fill="#374151">ฉาก</text>

  <!-- intensity pattern (central max wide + side lobes) -->
  <g fill="#fde68a" stroke="#d97706" stroke-width="1">
    <path d="M488,170 Q560,130 600,170 Q560,210 488,170 Z"/>
    <path d="M488,110 Q515,95 530,110 Q515,125 488,110 Z"/>
    <path d="M488,230 Q515,215 530,230 Q515,245 488,230 Z"/>
    <path d="M488,65 Q505,55 515,65 Q505,75 488,65 Z"/>
    <path d="M488,275 Q505,265 515,275 Q505,285 488,275 Z"/>
  </g>

  <text x="560" y="105" text-anchor="middle" font-size="12" fill="#92400e">แถบสว่างกลาง (กว้างสุด)</text>
  <text x="60" y="325" font-size="13" fill="#374151">คลื่นระนาบตกกระทบ</text>
  <text x="480" y="325" text-anchor="middle" font-size="12" fill="#374151">รูปแบบความเข้มแสง</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
