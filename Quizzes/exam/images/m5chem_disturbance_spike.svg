<svg viewBox="0 0 580 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="580" height="340" fill="#ffffff"/>
  <line x1="60" y1="290" x2="550" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#axD)"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="#374151" stroke-width="1.5" marker-end="url(#axD)"/>
  <text x="300" y="320" text-anchor="middle" font-size="14" fill="#374151">เวลา</text>
  <text x="25" y="160" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 25 160)">ความเข้มข้น</text>
  <text x="150" y="20" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">การรบกวนสมดุล N₂ + 3H₂ ⇌ 2NH₃ ที่เวลา t₁</text>

  <!-- t1 marker -->
  <line x1="270" y1="290" x2="270" y2="45" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="270" y="305" text-anchor="middle" font-size="12" fill="#6b7280">t₁</text>

  <!-- H2 curve: flat at equilibrium, then SPIKE UP at t1, then gradually decreases but stays above original level -->
  <path d="M75,230 L270,230 L270,60 C 320,100 400,130 550,140" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="80" y="222" font-size="13" fill="#2563eb" font-weight="bold">H₂</text>
  <text x="500" y="132" font-size="12" fill="#2563eb">H₂ (สมดุลใหม่ สูงกว่าเดิม)</text>

  <!-- N2 curve: flat, then decreases gradually after t1 -->
  <path d="M75,140 L270,140 C 330,150 420,170 550,180" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="80" y="132" font-size="13" fill="#dc2626" font-weight="bold">N₂</text>

  <!-- NH3 curve: flat, then increases gradually after t1 -->
  <path d="M75,255 L270,255 C 330,240 420,210 550,195" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="80" y="270" font-size="13" fill="#059669" font-weight="bold">NH₃</text>

  <defs>
    <marker id="axD" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
</svg>
