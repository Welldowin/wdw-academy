<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <line x1="60" y1="290" x2="530" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#axE)"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="#374151" stroke-width="1.5" marker-end="url(#axE)"/>
  <text x="300" y="320" text-anchor="middle" font-size="14" fill="#374151">เวลา</text>
  <text x="25" y="160" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 25 160)">ความเข้มข้น</text>
  <text x="150" y="20" text-anchor="middle" font-size="14" fill="#111827" font-weight="bold">ปฏิกิริยาผันกลับได้ A ⇌ B</text>

  <!-- equilibrium time marker -->
  <line x1="300" y1="290" x2="300" y2="30" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#6b7280">t (เข้าสู่สมดุล)</text>

  <!-- Curve A: starts high, decreases, plateaus at higher level than B -->
  <path d="M75,60 C 150,90 220,150 300,175 L 520,175" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="90" y="55" font-size="13" fill="#dc2626" font-weight="bold">A</text>

  <!-- Curve B: starts at 0, increases, plateaus lower than A -->
  <path d="M75,275 C 150,250 220,220 300,205 L 520,205" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="500" y="197" font-size="13" fill="#2563eb" font-weight="bold">B</text>

  <defs>
    <marker id="axE" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
</svg>
