<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <line x1="60" y1="290" x2="530" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#axM)"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="#374151" stroke-width="1.5" marker-end="url(#axM)"/>
  <text x="300" y="320" text-anchor="middle" font-size="14" fill="#374151">พลังงานจลน์ (KE)</text>
  <text x="25" y="160" text-anchor="middle" font-size="14" fill="#374151" transform="rotate(-90 25 160)">เศษส่วนโมเลกุล</text>

  <!-- Ea dashed vertical line -->
  <line x1="280" y1="290" x2="280" y2="45" stroke="#111827" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#111827">Ea</text>

  <!-- T1 curve: tall and narrow -->
  <path d="M65,285 C 110,280 140,60 175,55 C 210,50 240,220 300,270 C 360,290 450,290 525,290"
        fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="150" y="45" font-size="13" fill="#dc2626" font-weight="bold">T1</text>

  <!-- T2 curve: short, broad, shifted right -->
  <path d="M65,288 C 140,280 200,150 260,130 C 330,110 420,160 525,270"
        fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="360" y="115" font-size="13" fill="#2563eb" font-weight="bold">T2 (T2 &gt; T1)</text>

  <!-- shaded area right of Ea under T2 -->
  <path d="M280,131 C 330,110 420,160 525,270 L525,290 L280,290 Z" fill="#93c5fd" opacity="0.45"/>
  <text x="400" y="250" font-size="11" fill="#1e3a8a">พื้นที่ = อนุภาคที่พลังงานพอเกิดปฏิกิริยา</text>
  <defs>
    <marker id="axM" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#374151"/></marker>
  </defs>
</svg>
