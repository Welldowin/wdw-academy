<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'Sarabun','Tahoma',sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <line x1="20" y1="150" x2="620" y2="150" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- incoming parallel rays -->
  <g stroke="#2563eb" stroke-width="1.6">
    <line x1="20" y1="115" x2="150" y2="115"/>
    <line x1="20" y1="150" x2="150" y2="150"/>
    <line x1="20" y1="185" x2="150" y2="185"/>
  </g>
  <text x="60" y="95" font-size="12" fill="#2563eb">รังสีขนานเข้า</text>

  <!-- objective lens -->
  <ellipse cx="150" cy="150" rx="10" ry="85" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#1d4ed8">เลนส์ใกล้วัตถุ f₁=50cm</text>

  <!-- rays converge to intermediate focal point then diverge to eyepiece -->
  <g stroke="#f59e0b" stroke-width="1.4">
    <line x1="150" y1="115" x2="400" y2="150"/>
    <line x1="150" y1="150" x2="400" y2="150"/>
    <line x1="150" y1="185" x2="400" y2="150"/>
  </g>
  <circle cx="400" cy="150" r="3" fill="#f59e0b"/>
  <text x="400" y="135" text-anchor="middle" font-size="11" fill="#f59e0b">F₁ = F₂ (จุดโฟกัสร่วม)</text>

  <!-- eyepiece lens -->
  <ellipse cx="450" cy="150" rx="7" ry="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" fill="#16a34a">เลนส์ใกล้ตา f₂=5cm</text>

  <!-- outgoing parallel rays -->
  <g stroke="#dc2626" stroke-width="1.6">
    <line x1="450" y1="115" x2="610" y2="90"/>
    <line x1="450" y1="150" x2="610" y2="150"/>
    <line x1="450" y1="185" x2="610" y2="210"/>
  </g>
  <text x="560" y="75" font-size="12" fill="#dc2626">รังสีขนานออก (ภาพที่ ∞)</text>

  <!-- separation label -->
  <line x1="150" y1="270" x2="450" y2="270" stroke="#374151" stroke-width="1.2"/>
  <line x1="150" y1="265" x2="150" y2="275" stroke="#374151" stroke-width="1.2"/>
  <line x1="450" y1="265" x2="450" y2="275" stroke="#374151" stroke-width="1.2"/>
  <text x="300" y="288" text-anchor="middle" font-size="12" fill="#374151">ระยะห่างระหว่างเลนส์ = 55 cm = f₁ + f₂</text>

  <text x="320" y="30" text-anchor="middle" font-size="13" fill="#1f2937">ระบบกล้องโทรทรรศน์ (Afocal) — ภาพสุดท้ายอยู่ที่ระยะอนันต์</text>
</svg>
