<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WDW Quiz</title>
  <link rel="stylesheet" href="./quiz.css" />
  
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      startup: { typeset: false } // ปิดการรันออโต้ เพื่อรอให้ข้อสอบโหลดเสร็จก่อน
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-left">
        <img src="./assets/logo-wdw.png" alt="WDW Logo" class="brand-logo" />
        <div>
          <p class="eyebrow" id="courseTitle">Well-Do-Win Academy</p>
          <h1 id="quizTitle">กำลังโหลดข้อมูล...</h1>
          <p class="subtext">ตอบได้เพียง 1 ครั้งต่อ 1 บัญชี</p>
        </div>
      </div>

      <div class="hero-right">
        <div id="timerBox" class="timer hidden">
          ⏱️ <span id="timerText">00:00</span>
        </div>
      </div>
    </header>

    <section class="status-card">
      <p id="studentInfo">กำลังตรวจสอบข้อมูลผู้ใช้...</p>
      <p id="modeInfo" class="mode-info"></p>

      <div class="display-name-box" id="displayNameBox">
        <label for="displayNameInput">ชื่อที่แสดงบน Leaderboard</label>
        <input
          type="text"
          id="displayNameInput"
          class="answer-input"
          placeholder="ชื่อที่จะแสดงบน Leaderboard"
          maxlength="30"
          required
        />
      </div>
    </section>

    <form id="quizForm" class="quiz-form"></form>

    <div class="actions" id="actionsBar">
      <button id="submitBtn" type="submit" form="quizForm" class="btn primary">
        ส่งคำตอบ
      </button>
      <a id="leaderboardBtn" href="./leaderboard.html" class="btn ghost">ไปหน้า Leaderboard</a>
    </div>

    <section id="resultInline" class="result-inline hidden"></section>
  </div>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./quiz.js"></script>
</body>
</html>
