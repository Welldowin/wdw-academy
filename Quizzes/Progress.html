<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เช็คความคืบหน้า Quiz | WDW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./progress.css" />
</head>
<body>
  <div class="page">

    <section class="card hero-card">
      <div class="hero-wrap">
        <img src="./assets/logo-wdw.jpg" alt="WDW Logo" class="brand-logo" />
        <div>
          <h1>📊 เช็คความคืบหน้า Quiz</h1>
          <p class="muted">ดูว่านักเรียนแต่ละคนทำ quiz ไหนแล้วบ้าง — เลือกคอร์สด้านล่าง</p>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="controls">
        <div class="field">
          <label for="courseSelect">เลือกคอร์ส</label>
          <select id="courseSelect"></select>
        </div>
        <div class="field">
          <label for="searchBox">ค้นหาชื่อนักเรียน</label>
          <input type="search" id="searchBox" placeholder="พิมพ์ชื่อ / ชื่อเล่น..." />
        </div>
      </div>

      <div class="legend">
        <span><span class="ico">🚀</span> ทำครบทุก quiz</span>
        <span><span class="ico">👍</span> มีข้ามบ้าง (ไม่ติดกัน)</span>
        <span><span class="ico">💀</span> ข้าม 2 quiz ล่าสุดติดกัน</span>
      </div>
    </section>

    <section class="card">
      <div class="summary-grid" id="summary"></div>
    </section>

    <section class="card">
      <h2 id="tableTitle">ตารางความคืบหน้า</h2>
      <div class="table-wrap">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody">
            <tr><td class="state">เลือกคอร์สเพื่อเริ่มดูข้อมูล</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script type="module" src="./firebase-config.js"></script>
  <script src="./progress-config.js"></script>
  <script type="module" src="./progress.js"></script>
</body>
</html>
