<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชำระเงินคอร์สเรียน | Well-Do-Win Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #fffdf5;
      color: #333;
    }

    .container {
      max-width: 640px;
      margin: 20px auto;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
      color: #1E3D8F;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1E3D8F;
    }

    .price-box {
      font-size: 18px;
      font-weight: 700;
      color: #d9460f;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #d94c4c;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn:hover {
      background: #c0392b;
    }

    .qr-box {
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    .qr-box img {
      width: 220px;
      margin: 10px auto;
      display: block;
    }

    .coupon-message {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ปุ่มย้อนกลับมุมซ้ายบน */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1E3D8F;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .back-link span.arrow {
      font-size: 18px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ปุ่มย้อนกลับไปหน้าเลือกคอร์ส -->
    <!-- ถ้าพี่ใช้ชื่อไฟล์ course.html ให้เปลี่ยน href="course.html" -->
    <a href="courses.html" class="back-link">
      <span class="arrow">←</span>
      กลับไปหน้าเลือกคอร์ส
    </a>

    <!-- กล่องรายละเอียดคอร์ส + ตารางเรียน -->
    <div class="card" id="courseDetail"></div>

    <!-- กล่องใส่โค้ดส่วนลด -->
    <div class="card">
      <h3>โค้ดส่วนลดศิษย์เก่า</h3>
      <input id="coupon" type="text" placeholder="กรอกโค้ดส่วนลด">
      <div id="couponMsg" class="coupon-message"></div>
    </div>

    <!-- ยอดชำระ -->
    <div class="card">
      <div class="price-box">
        ยอดที่ต้องชำระ: <span id="totalPrice"></span> บาท
      </div>
      <button class="btn" onclick="createOrder()">ชำระเงินด้วย QR Code</button>
    </div>

    <!-- QR Code -->
    <div class="qr-box" id="qrBox">
      <p>สแกนเพื่อชำระเงิน</p>
      <img id="qrImage" src="" alt="QR Payment">
      <p style="font-size:18px;color:#555;">
        หลังชำระเงิน กรุณาแคปหลักฐานการโอน
        และส่งสลิปมาที่
        <a href="https://lin.ee/6sIEVNC" target="_blank" rel="noopener" style="color:#1E3A8A; font-weight:600;">
          LINE: @welldowin
        </a>
        เพื่อให้ครู/แอดมินยืนยันสิทธิ์เปิดคอร์สให้ครับ
      </p>
    </div>

  </div>

<script>
  // ===== 1) ตั้งค่า PromptPay (ไม่ต้องใช้ ORDER_API_URL แล้ว) =====
  const PROMPTPAY_ID  = '0635455645';

  // ===== 2) ข้อมูลคอร์ส + ตารางเรียน =====
  const courseData = {
    "term2-phy-chem-chumpae": {
      title: "คอร์สเทอม 2 – ฟิสิกส์/เคมี (ชุมแพ)",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>จำนวน 40 ชั่วโมง</li>
          <li>มีวิดีโอย้อนหลังทุกครั้ง</li>
          <li>กลุ่มวันอังคาร/พฤหัส หรือ กลุ่มวันเสาร์</li>
          <li>เริ่มเรียน 18 พ.ย. 68 – 14 ก.พ. 69</li>
        </ul>
      `
    },
    "m4-term2-chumpae": {
      title: "คอร์สเทอม 2 – ม.4 ฟิสิกส์/เคมี",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>เรียนทุกวันเสาร์</li>
          <li>ฟิสิกส์ 09.00–10.30</li>
          <li>เคมี 13.00–14.30</li>
          <li>วันที่เรียน: 22 พ.ย. 68 – 14 ก.พ. 69</li>
        </ul>
      `
    },
    "m5-term2-chumpae": {
      title: "คอร์สเทอม 2 – ม.5 ฟิสิกส์/เคมี",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>เรียนทุกวันเสาร์</li>
          <li>ฟิสิกส์ 10.45–12.15</li>
          <li>เคมี 14.30–16.00</li>
          <li>วันที่เรียน: 22 พ.ย. 68 – 14 ก.พ. 69</li>
        </ul>
      `
    },
    "online-tgat-tpat-alevel": {
      title: "คอร์สออนไลน์ – TGAT / TPAT3 / A-Level",
      price: 4000,
      schedule: `
        <h3>รายละเอียดการเรียน</h3>
        <ul>
          <li>เรียนแบบออนไลน์ตัวต่อตัว</li>
          <li>กำหนดเวลาเรียนได้เอง</li>
          <li>เริ่มต้น 18 ชั่วโมง ราคา 4,000 บาท</li>
          <li>จนถึงสอบ 14 มี.ค. 69</li>
          <li>หมายเหตุ : 2 คนขึ้นไป คนละ 200 บ./ชม. (แจ้งทางไลน์)</li>
        </ul>
      `
    },
    "online-netsat": {
      title: "คอร์สออนไลน์ – NETSAT ฟิสิกส์/เคมี",
      price: 4000,
      schedule: `
        <h3>รายละเอียดการเรียน</h3>
        <ul>
          <li>เรียนแบบออนไลน์ยืดหยุ่น</li>
          <li>กำหนดเวลาเรียนได้เอง</li>
          <li>เริ่มต้น 18 ชั่วโมง ราคา 4,000 บาท</li>
          <li>จนถึงสอบ 7 ก.พ. 69</li>
          <li>หมายเหตุ : 2 คนขึ้นไป คนละ 200 บ./ชม. (แจ้งทางไลน์)</li>
        </ul>
      `
    },
    "m4-summer": {
      title: "คอร์สซัมเมอร์ - เตรียม ม.4 ฟิสิกส์/เคมี",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>เรียนทุกอังคารถึงศุกร์</li>
          <li>ฟิสิกส์ อ. / พฤ. 10.30–12.00</li>
          <li>เคมี พ. / ศ. 10.30–12.00</li>
          <li>วันที่เรียน: 10 มี.ค. ถึง 8 พ.ค.69)</li>
        </ul>
      `
    },
    "m5-summer": {
      title: "คอร์สซัมเมอร์ - เตรียม ม.5 ฟิสิกส์/เคมี",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>เรียนทุกอังคารถึงศุกร์</li>
          <li>ฟิสิกส์ อ. / พฤ. 15.00–16.30</li>
          <li>เคมี พ. / ศ. 15.00–16.30</li>
          <li>วันที่เรียน: 10 มี.ค. ถึง 8 พ.ค.69)</li>
        </ul>
      `
    },
    "m6-summer": {
      title: "คอร์สซัมเมอร์ - เตรียม ม.6 ฟิสิกส์/เคมี",
      price: 3500,
      schedule: `
        <h3>ตารางเวลาเรียน</h3>
        <ul>
          <li>เรียนทุกอังคารถึงศุกร์</li>
          <li>ฟิสิกส์ อ. / พฤ. 13.30–15.00</li>
          <li>เคมี พ. / ศ. 13.30–15.00</li>
          <li>วันที่เรียน: 10 มี.ค. ถึง 8 พ.ค.69)</li>
        </ul>
      `
    }
  };

  // ===== 3) โหลดคอร์สจาก URL / localStorage แล้วแสดงบนหน้า =====
  const urlParams = new URLSearchParams(window.location.search);
  let courseId = urlParams.get('course');

  if (!courseId && localStorage.getItem('pendingCourseId')) {
    courseId = localStorage.getItem('pendingCourseId');
  }

  const courseDetailBox = document.getElementById('courseDetail');
  const totalPriceSpan  = document.getElementById('totalPrice');

  const course = courseData[courseId];
  let price        = course ? course.price : 0;
  let finalPrice   = price;
  let currentCoupon = '';

  if (course) {
    courseDetailBox.innerHTML = `
      <h2>${course.title}</h2>
      ${course.schedule}
      <div style="font-size:15px;margin-top:10px;">
        <strong>ราคา:</strong> ${course.price} บาท<br>
        * ศิษย์เก่าลด 200 บาทโดยใช้โค้ดส่วนลดด้านล่าง
      </div>
    `;
  } else {
    courseDetailBox.innerHTML = `
      <p>ไม่พบข้อมูลคอร์สที่ต้องการชำระเงิน</p>
      <p><a href="courses.html">คลิกที่นี่เพื่อกลับไปเลือกคอร์สอีกครั้ง</a></p>
    `;
  }

  totalPriceSpan.textContent = finalPrice;

   // ===== 4) ระบบโค้ดส่วนลด =====
  document.getElementById('coupon').addEventListener('input', function () {
    const code = this.value.trim().toUpperCase();
    const msg  = document.getElementById('couponMsg');

    // รวมโค้ดทั้งหมดไว้ตรงนี้
    const coupons = {
      'SUMMERNEW200':  { type: 'fixed',   value: 200 },
      'SUMMERDERM400': { type: 'fixed',   value: 400 },
      'LASTSTAND21':   { type: 'fixed',   value: 290 },
      'SUMMERSPD10':   { type: 'percent', value: 10 }
    };

    if (coupons[code]) {

      const coupon = coupons[code];
      let discount = 0;

      if (coupon.type === 'fixed') {
        discount = coupon.value;
      } else if (coupon.type === 'percent') {
        discount = price * (coupon.value / 100);
      }

      finalPrice = Math.max(price - discount, 0);
      currentCoupon = code;

      if (coupon.type === 'percent') {
        msg.textContent = `ใช้โค้ดสำเร็จ! ลด ${coupon.value}% 🎉`;
      } else {
        msg.textContent = `ใช้โค้ดสำเร็จ! ลด ${coupon.value} บาท 🎉`;
      }

      msg.style.color = 'green';

    } else if (code.length > 0) {

      finalPrice = price;
      currentCoupon = '';
      msg.textContent = 'โค้ดไม่ถูกต้อง';
      msg.style.color = 'red';

    } else {

      finalPrice = price;
      currentCoupon = '';
      msg.textContent = '';

    }

    totalPriceSpan.textContent = finalPrice;
  });

  // ===== 5) ฟังก์ชันเมื่อกดปุ่ม "ชำระเงินด้วย QR Code" =====
  // ไม่บันทึกลงชีตแล้ว แค่เช็กข้อมูลให้ครบแล้วโชว์ QR เลย
  function createOrder() {
    if (!course) {
      alert('ไม่พบข้อมูลคอร์ส กรุณากลับไปเลือกคอร์สใหม่อีกครั้ง');
      return;
    }

    // ถ้าอยากบังคับให้มี userId (ล็อกอินก่อน) จะใช้ logic นี้ได้
    const userId = localStorage.getItem('userId') || '';
    if (!userId) {
      const proceed = confirm(
        'ยังไม่พบข้อมูลผู้ใช้ในระบบ (userId)\n' +
        'ต้องการสร้าง QR ชำระเงินต่อเลยหรือไม่?'
      );
      if (!proceed) return;
    }

    showQR();
  }

  window.createOrder = createOrder;

  // ===== 6) แสดง QR Code =====
  function showQR() {
    const amount = finalPrice || price || 0;
    const qrUrl  = `https://promptpay.io/${PROMPTPAY_ID}/${amount}`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('qrBox').style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
</script>

</body>
</html>
