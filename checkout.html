<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชำระเงินคอร์สเรียน | Well-Do-Win Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: #fffdf5;
      color: #333;
    }

    .container {
      max-width: 640px;
      margin: 20px auto;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
      color: #1E3D8F;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1E3D8F;
    }

    .price-box {
      font-size: 18px;
      font-weight: 700;
      color: #d9460f;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      margin-top: 8px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #d94c4c;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .qr-box {
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    .qr-box img {
      width: 220px;
      margin: 10px auto;
      display: block;
    }

    .coupon-message {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    /* ปุ่มย้อนกลับมุมซ้ายบน */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1E3D8F;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .back-link span.arrow {
      font-size: 18px;
      line-height: 1;
    }

    #actionButtons {
        display: flex;
        gap: 10px;
        margin-top: 16px;
    }
    
    @media (max-width: 480px) {
        #actionButtons {
            flex-direction: column;
        }
        #actionButtons .btn {
            width: 100% !important;
        }
    }
  </style>
</head>
<body>

  <div class="container">

    <a href="courses.html" class="back-link">
      <span class="arrow">←</span>
      กลับไปหน้าเลือกคอร์ส
    </a>

    <div class="card" id="courseDetail"></div>

    <div class="card">
      <h3>โค้ดส่วนลดศิษย์เก่า / Early Bird</h3>
      <input id="coupon" type="text" placeholder="กรอกโค้ดส่วนลด (ถ้ามี)">
      <div id="couponMsg" class="coupon-message"></div>
    </div>

    <div class="card">
      <div class="price-box">
        ยอดที่ต้องชำระ: <span id="totalPrice"></span> บาท
      </div>
      
      <!-- ปุ่มแยกการจ่ายเงิน (ชำระทีหลัง / ชำระตอนนี้) -->
      <div id="actionButtons">
        <button class="btn" style="background:#f39c12; line-height:1.2; padding:10px; width:50%;" onclick="enrollCourse('pay_later')">
          ลงชื่อสมัครคอร์สนี้<br><span style="font-size:14px; font-weight:normal;">(จ่ายทีหลัง)</span>
        </button>
        <button class="btn" style="background:#d94c4c; line-height:1.2; padding:10px; width:50%;" onclick="enrollCourse('pay_now')">
          ชำระเงินด้วย<br><span style="font-size:14px; font-weight:normal;">QR Code</span>
        </button>
      </div>
    </div>

    <div class="qr-box" id="qrBox">
      <p>สแกนเพื่อชำระเงิน</p>
      <img id="qrImage" src="" alt="QR Payment">
      <p style="font-size:18px;color:#555;">
        หลังชำระเงิน กรุณาแคปหลักฐานการโอน
        และส่งสลิปมาที่
        <a href="https://lin.ee/n6iQfZx" target="_blank" rel="noopener" style="color:#1E3A8A; font-weight:600;">
          LINE: @welldowin
        </a>
        เพื่อให้ครู/แอดมินยืนยันสิทธิ์เปิดคอร์สให้ครับ
      </p>
    </div>

  </div>

<script>
  // ===== 1) ตั้งค่า PromptPay =====
  const PROMPTPAY_ID  = '0635455645';

  // ===== 2) ข้อมูลคอร์ส + โครงสร้าง HTML แบบ Template =====
  const courseTemplate = (level, title, timeSchedule, imgName) => `
    <img src="images/${imgName}" alt="ตารางเรียน ${level}" style="width:100%; border-radius:10px; margin-bottom:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <p style="font-size:14px; color:#555;">
      <strong>ตารางเรียน ${level}:</strong><br>
      ${timeSchedule}
    </p>
    <div style="margin-top:14px; padding-top:10px; border-top: 1px dashed #ccc;">
      <label style="font-weight:700; color:#1E3D8F;">เลือกจำนวนวิชาที่ต้องการสมัคร:</label>
      <select id="subjectSelect" style="width:100%; padding:10px; border-radius:8px; margin-top:6px; border: 1px solid #ccc; font-family:'Kanit', sans-serif;" onchange="updatePriceAndOptions(this.value)">
        <option value="2000_1">1 วิชา (2,000.- / จ่ายเต็มจำนวน)</option>
        <option value="3600_2">2 วิชา (3,600.- / หรือโอนแบ่งจ่ายงวดแรก 1,800.-)</option>
        <option value="4500_3">3 วิชา (4,500.- / หรือโอนแบ่งจ่ายงวดแรก 2,250.-)</option>
      </select>
      
      <!-- Dropbox สำหรับระบุวิชา -->
      <div id="subjectChoiceBox" style="margin-top:10px; display:block;">
        <label style="font-weight:700; color:#1E3D8F;">ระบุวิชาที่ต้องการเรียน:</label>
        <!-- ค่า Value ถูกตั้งค่าให้สามารถนำไปแตก (Split) ด้วยขีด (-) ได้ง่าย -->
        <select id="subjectChoice" style="width:100%; padding:10px; border-radius:8px; margin-top:6px; border: 1px solid #ccc; font-family:'Kanit', sans-serif;">
          <option value="math">คณิตศาสตร์</option>
          <option value="physics">ฟิสิกส์</option>
          <option value="chem">เคมี</option>
        </select>
      </div>

      <p style="font-size:13px; color:#d9460f; margin-top:6px;">
        * หากต้องการผ่อนชำระ กรุณาโอนยอดตามงวดแรกที่ระบุในวงเล็บ (1,800 หรือ 2,250) แล้วแจ้งแอดมินทาง LINE ได้เลยครับ
      </p>
    </div>
  `;

  const courseData = {
    "m4-term1": {
      title: "คอร์สเทอม 1/2569 – ม.4 (คณิต/ฟิสิกส์/เคมี)",
      price: 2000,
      schedule: courseTemplate("ม.4", "คอร์สเทอม 1/2569 – ม.4", "- <b>วันศุกร์ (เย็น):</b> 17:00-18:00 น. | เคมี<br>- <b>วันเสาร์ (เช้า):</b> 09:00-10:00 น. | คณิต, 11:00-12:00 น. | ฟิสิกส์", "4.png")
    },
    "m5-term1": {
      title: "คอร์สเทอม 1/2569 – ม.5 (คณิต/ฟิสิกส์/เคมี)",
      price: 2000,
      schedule: courseTemplate("ม.5", "คอร์สเทอม 1/2569 – ม.5", "- <b>วันศุกร์ (ค่ำ):</b> 18:00-19:00 น. | เคมี<br>- <b>วันเสาร์ (บ่าย):</b> 13:30-14:30 น. | คณิต, 15:30-16:30 น. | ฟิสิกส์", "5.png")
    },
    "m6-term1": {
      title: "คอร์สเทอม 1/2569 – ม.6 (คณิต/ฟิสิกส์/เคมี)",
      price: 2000,
      schedule: courseTemplate("ม.6", "คอร์สเทอม 1/2569 – ม.6", "- 10:00-11:00 น. | คณิต<br>- 12:30-13:30 น. | ฟิสิกส์<br>- 14:30-15:30 น. | เคมี", "6.png")
    },
    "online-tgat-tpat-alevel": {
      title: "คอร์สออนไลน์ – TGAT / TPAT3 / A-Level",
      price: 4000,
      schedule: `
        <h3>รายละเอียดการเรียน</h3>
        <ul>
          <li>เรียนแบบออนไลน์ตัวต่อตัว</li>
          <li>กำหนดเวลาเรียนได้เอง</li>
          <li>เริ่มต้น 18 ชั่วโมง ราคา 4,000 บาท</li>
          <li>หมายเหตุ : 2 คนขึ้นไป คนละ 200 บ./ชม. (แจ้งทางไลน์)</li>
        </ul>
        <div style="font-size:15px;margin-top:10px;">
          <strong>ราคา:</strong> 4,000 บาท<br>
        </div>
      `
    },
    "online-netsat": {
      title: "คอร์สออนไลน์ – NETSAT ฟิสิกส์/เคมี",
      price: 4000,
      schedule: `
        <h3>รายละเอียดการเรียน</h3>
        <ul>
          <li>เรียนแบบออนไลน์ยืดหยุ่น</li>
          <li>กำหนดเวลาเรียนได้เอง</li>
          <li>เริ่มต้น 18 ชั่วโมง ราคา 4,000 บาท</li>
          <li>หมายเหตุ : 2 คนขึ้นไป คนละ 200 บ./ชม. (แจ้งทางไลน์)</li>
        </ul>
        <div style="font-size:15px;margin-top:10px;">
          <strong>ราคา:</strong> 4,000 บาท<br>
        </div>
      `
    }
  };

  // ===== 3) โหลดคอร์สจาก URL / localStorage แล้วแสดงบนหน้า =====
  const urlParams = new URLSearchParams(window.location.search);
  let courseId = urlParams.get('course');

  if (!courseId && localStorage.getItem('pendingCourseId')) {
    courseId = localStorage.getItem('pendingCourseId');
  }

  const courseDetailBox = document.getElementById('courseDetail');
  const totalPriceSpan  = document.getElementById('totalPrice');

  const course = courseData[courseId];
  let price        = course ? course.price : 0;
  let finalPrice   = price;
  let currentCoupon = '';

  if (course) {
    courseDetailBox.innerHTML = `
      <h2>${course.title}</h2>
      ${course.schedule}
    `;
  } else {
    courseDetailBox.innerHTML = `
      <p>ไม่พบข้อมูลคอร์สที่ต้องการชำระเงิน</p>
      <p><a href="courses.html">คลิกที่นี่เพื่อกลับไปเลือกคอร์สอีกครั้ง</a></p>
    `;
  }

  totalPriceSpan.textContent = finalPrice;

  // ===== 4) ฟังก์ชันอัปเดตราคา และตัวเลือกวิชาย่อยตามจำนวนวิชา =====
  window.updatePriceAndOptions = function(val) {
    if(!val) return;
    const parts = val.split('_');
    const newPrice = parseInt(parts[0], 10);
    const count = parseInt(parts[1], 10);
    
    price = newPrice;
    document.getElementById('coupon').dispatchEvent(new Event('input'));

    const choiceBox = document.getElementById('subjectChoiceBox');
    const choiceSelect = document.getElementById('subjectChoice');
    if(!choiceBox || !choiceSelect) return;
    
    choiceSelect.innerHTML = '';
    
    // ตั้งค่า Value ให้เป็น String คั่นด้วยขีด เพื่อให้ JavaScript นำไปแยกได้ง่าย
    if(count === 1) {
      choiceSelect.innerHTML = `
        <option value="math">คณิตศาสตร์</option>
        <option value="physics">ฟิสิกส์</option>
        <option value="chem">เคมี</option>
      `;
      choiceBox.style.display = 'block';
    } else if(count === 2) {
      choiceSelect.innerHTML = `
        <option value="math-physics">คณิตศาสตร์ / ฟิสิกส์</option>
        <option value="physics-chem">ฟิสิกส์ / เคมี</option>
        <option value="math-chem">คณิตศาสตร์ / เคมี</option>
      `;
      choiceBox.style.display = 'block';
    } else if(count === 3) {
      choiceSelect.innerHTML = `
        <option value="math-physics-chem">เรียนทั้ง 3 วิชา (คณิต/ฟิสิกส์/เคมี)</option>
      `;
      choiceBox.style.display = 'block';
    }
  };

  // ===== 5) ระบบโค้ดส่วนลด =====
  document.getElementById('coupon').addEventListener('input', function () {
    const code = this.value.trim().toUpperCase();
    const msg  = document.getElementById('couponMsg');

    const coupons = {
      'EARLYBIRD200':  { type: 'fixed',   value: 200 },
      'OLDSTUDENTWDW':   { type: 'fixed',   value: 200 },
      'SUMMERSPD10':   { type: 'percent', value: 10 }
    };

    if (coupons[code]) {
      const coupon = coupons[code];
      let discount = 0;

      if (coupon.type === 'fixed') {
        discount = coupon.value;
      } else if (coupon.type === 'percent') {
        discount = price * (coupon.value / 100);
      }

      finalPrice = Math.max(price - discount, 0);
      currentCoupon = code;

      msg.textContent = coupon.type === 'percent' ? `ใช้โค้ดสำเร็จ! ลด ${coupon.value}% 🎉` : `ใช้โค้ดสำเร็จ! ลด ${coupon.value} บาท 🎉`;
      msg.style.color = 'green';

    } else if (code.length > 0) {
      finalPrice = price;
      currentCoupon = '';
      msg.textContent = 'โค้ดไม่ถูกต้อง';
      msg.style.color = 'red';

    } else {
      finalPrice = price;
      currentCoupon = '';
      msg.textContent = '';
    }

    totalPriceSpan.textContent = finalPrice;
  });

  // ===== 6) ฟังก์ชันบันทึกการสมัครเรียนแบบแยกรายวิชา (Comma-separated) =====
  window.enrollCourse = async function(type) {
    if (!course) {
      alert('ไม่พบข้อมูลคอร์ส กรุณากลับไปเลือกคอร์สใหม่อีกครั้ง');
      return;
    }

    const userId = localStorage.getItem('userId') || '';
    if (!userId) {
      alert('กรุณาเข้าสู่ระบบก่อนสมัครคอร์สครับ');
      window.location.href = 'login.html';
      return;
    }

    if (confirm("ต้องการยืนยันจะลงชื่อเรียนคอร์สนี้หรือไม่?")) {
      
      let finalCourseId = courseId;
      const choiceSelect = document.getElementById('subjectChoice');
      
      // ถ้ามีการเลือกวิชา ให้หั่น (Split) เพื่อกระจายเป็นรายวิชาแยกกันด้วยลูกน้ำ (Comma)
      if (choiceSelect && choiceSelect.value) {
         const subjects = choiceSelect.value.split('-'); // เช่น 'math-physics' กลายเป็น ['math', 'physics']
         // แปลงแต่ละวิชาให้มี Prefix ของชั้นปี เช่น 'm5-term1-math', 'm5-term1-physics'
         const courseArray = subjects.map(sub => courseId + '-' + sub);
         // รวมกลับเป็น String ด้วยลูกน้ำ
         finalCourseId = courseArray.join(','); 
      }
      
      const btnBox = document.getElementById('actionButtons');
      const originalBtns = btnBox.innerHTML;
      btnBox.innerHTML = '<p style="text-align:center; color:#1E3D8F; font-weight:bold; width:100%; font-size: 16px;">กำลังลงชื่อสมัครเรียนให้ครับ... ⏳</p>';

      try {
        const url = "https://script.google.com/macros/s/AKfycbzgYdGzCy_g5SiIT1WBYUBjFtkA_zZhN_WTlyolp9ziE8mhFhVT85CHcZF5YHM2s4NQ/exec";
        const response = await fetch(url + '?action=enroll&userId=' + encodeURIComponent(userId) + '&courseId=' + encodeURIComponent(finalCourseId));
        const data = await response.json();

        if (data.status === 'ok') {
          if (type === 'pay_now') {
            btnBox.innerHTML = originalBtns; 
            showQR(); 
          } else {
            alert("ลงชื่อสมัครเรียนเรียบร้อยแล้ว! สามารถชำระเงินภายหลังได้ผ่านหน้าระบบสมาชิกครับ 🎉");
            window.location.href = "member.html";
          }
        } else {
          alert("เกิดข้อผิดพลาด: " + data.message);
          btnBox.innerHTML = originalBtns;
        }
      } catch(err) {
        console.error(err);
        alert("ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่ครับ");
        btnBox.innerHTML = originalBtns;
      }
    }
  };

  // ===== 7) แสดง QR Code =====
  function showQR() {
    const amount = finalPrice || price || 0;
    const qrUrl  = `https://promptpay.io/${PROMPTPAY_ID}/${amount}`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('qrBox').style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
</script>

</body>
</html>
